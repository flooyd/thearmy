[package]
name = "mygame"
version = "0.1.0"
edition = "2024"

#without this a debug build drops to about 60 fps when zoomed all the way out, too slow for a 120hz display (and at 13,000 units, level 1 was not enough)
[profile.dev]
opt-level = 2

#the libraries (macroquad, rayon) are built once and then left alone, so they can afford to be built for speed
[profile.dev.package."*"]
opt-level = 3

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }

#shares the work of a big army out over the processor's cores
rayon = "1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
