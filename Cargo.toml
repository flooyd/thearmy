[package]
name = "mygame"
version = "0.3.5"
edition = "2024"

#without this a debug build drops to about 60 fps when zoomed all the way out, too slow for a 120hz display (and at 13,000 units, level 1 was not enough)
[profile.dev]
opt-level = 2

#the libraries (macroquad, rayon) are built once and then left alone, so they can afford to be built for speed
[profile.dev.package."*"]
opt-level = 3

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }

#shares the work of a big army out over the processor's cores
rayon = "1.10"

#multiplayer: QUIC (encrypted, over UDP) with a self-signed certificate; the tokio runtime lives on the network threads only
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

#multiplayer: the password is never sent, only a proof made from a key stretched out of it (see handshake.rs)
getrandom = "0.4.3"
hmac = "0.13.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha2 = "0.11.1"

#the lobby list: a small blocking HTTPS client, used only on a thread of its own (see directory.rs)
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

#the graphics library with one change (see vendor/README.md): without it, text now and then turns into black blocks
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
